<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Ops v2 — Exercise demo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#F2C14E}a:hover{color:#FFD97A}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #081120; color: #EEF2F8; font-family: Inter, sans-serif; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #111F35; color: #EEF2F8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 style="margin: 0; flex: 1; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700">Full-Body Strength</h1>
    <div style="width: 44px"></div>
  </div>

  <div style="position: relative; height: 300px; border-radius: 22px; background: #111F35; overflow: hidden; display: flex; align-items: center; justify-content: center">
    <svg width="260" height="260" viewBox="0 0 200 200" role="img" aria-label="Animated figure demonstrating a bodyweight squat, side view">
      <circle cx="105" cy="110" r="78" fill="#15263F"/>
      <rect x="30" y="182" width="150" height="6" rx="3" fill="#22395C"/>
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="92,132 128,148 112,180 130,180" stroke="#7D6A2E" stroke-width="12"/>
        <polyline points="118,90 146,98 170,94" stroke="#7D6A2E" stroke-width="10"/>
        <line x1="92" y1="132" x2="118" y2="86" stroke="#EEF2F8" stroke-width="16"/>
        <polyline points="92,132 134,142 114,180 134,180" stroke="{{accent}}" stroke-width="12"/>
        <polyline points="118,90 148,102 174,98" stroke="{{accent}}" stroke-width="10"/>
      </g>
      <circle cx="126" cy="67" r="14" fill="#EEF2F8"/>
    </svg>
    <span style="position: absolute; top: 14px; right: 14px; padding: 6px 12px; border-radius: 999px; background: #081120; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700">1 / 5</span>
    <span style="position: absolute; top: 14px; left: 14px; padding: 6px 12px; border-radius: 999px; background: #2B2A1E; color: {{accent}}; font-size: 12px; font-weight: 700">Side view</span>
    <div style="position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center">
      <button aria-label="Play animation" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: {{accent}}; color: #081120; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#081120" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
      <div style="display: flex; gap: 8px">
        <button style="height: 40px; padding: 0 12px; border-radius: 12px; border: none; background: #081120; color: #EEF2F8; font-size: 13px; font-weight: 600">0.5×</button>
        <button aria-label="Full screen" style="width: 40px; height: 40px; border-radius: 12px; border: none; background: #081120; color: #EEF2F8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </div>

  <div style="text-align: center; display: flex; flex-direction: column; gap: 2px">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700">Bodyweight Squats</h2>
    <span style="font-size: 15px; color: #93A3BC">2 sets · 12 reps · rest 45 s</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div style="background: #111F35; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; align-items: center">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 46px; font-weight: 700; line-height: 1">0<span style="font-size: 26px; color: #93A3BC"> / 12</span></span>
      <span style="font-size: 12px; color: #93A3BC">Reps</span>
    </div>
    <div style="background: #111F35; border-radius: 18px; padding: 14px; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5l3 2M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM10 2h4"/></svg>
      <div style="display: flex; flex-direction: column"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">00:00</span><span style="font-size: 12px; color: #93A3BC">Active time</span></div>
    </div>
  </div>

  <div style="height: 46px; border-radius: 14px; background: #2B2A1E; color: {{accent}}; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center">Get ready… starting in 3</div>

  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 54px; border-radius: 27px; border: 1.5px solid #3A5174; background: transparent; color: #EEF2F8; font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 700">Pause</button>
    <button style="height: 54px; border-radius: 27px; border: none; background: {{accent}}; color: #081120; font-family: 'Barlow Condensed', sans-serif; font-size: 21px; font-weight: 700">Start with camera</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C14E","options":["#F2C14E","#E0B04A","#D4A537"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#F2C14E' }; }
}
</script>
</body>
</html>
