<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Ops v2 — Weekly report</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#F2C14E}a:hover{color:#FFD97A}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #081120; color: #EEF2F8; font-family: Inter, sans-serif; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="width: 44px; height: 44px; border-radius: 14px; background: #2B2A1E; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3M16 3v3M4 8h16v12H4zM8 12h2M12 12h2M16 12h0M8 16h2M12 16h2"/></svg></span>
    <div style="display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">Weekly Report</h1>
      <span style="font-size: 13px; color: #93A3BC">Week 1 · 9 – 15 November</span>
    </div>
  </div>

  <div style="background: #111F35; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
    <svg width="168" height="168" viewBox="0 0 120 120" role="img" aria-label="86 percent of workouts completed">
      <circle cx="60" cy="60" r="50" fill="none" stroke="#1E3253" stroke-width="11"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="{{accent}}" stroke-width="11" stroke-linecap="round" stroke-dasharray="270.2 314.2" transform="rotate(-90 60 60)"/>
      <text x="60" y="68" text-anchor="middle" font-family="Barlow Condensed" font-size="34" font-weight="700" fill="#EEF2F8">86%</text>
    </svg>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700">6 / 7 workouts</span>
  </div>

  <div style="background: #111F35; border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="{{r.style}}">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#081120" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 13px; color: #93A3BC">{{r.label}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">{{r.value}}</span></div>
        <span style="font-size: 14px; font-weight: 700; color: {{accent}}">{{r.change}}</span>
      </div>
    </sc-for>
  </div>

  <div style="background: #2B2A1E; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6v4H9z"/></svg>
    <div style="display: flex; flex-direction: column"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: {{accent}}">Achievement: 6-day streak</span><span style="font-size: 13px; color: #E8E1C4">Your longest run of training days yet.</span></div>
  </div>

  <button style="margin-top: auto; height: 56px; border: none; border-radius: 28px; background: {{accent}}; color: #081120; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">View details
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C14E","options":["#F2C14E","#E0B04A","#D4A537"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { label: 'Active exercise time', value: '2 h 45 min', change: '↑ 12%' },
      { label: 'Weight', value: '78.4 kg', change: '↓ 1.2 kg' },
      { label: 'Waist', value: '92 cm', change: '↓ 2 cm' },
      { label: 'Water (daily average)', value: '2.1 L', change: '↑ 0.4 L' }
    ].map((r, i, a) => ({ ...r, style: 'display: flex; align-items: center; gap: 12px; padding: 10px 0; ' + (i < a.length - 1 ? 'border-bottom: 1px solid #1E3253' : '') }));
    return { accent: this.props.accent ?? '#F2C14E', rows };
  }
}
</script>
</body>
</html>
