<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Ops v2 — My progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#F2C14E}a:hover{color:#FFD97A}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #081120; color: #EEF2F8; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <h1 style="margin: 0; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700">My Progress</h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #111F35">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="background: #111F35; border-radius: 20px; padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">Weight trend</span>
        <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700; line-height: 1">78.4 kg</span><span style="font-size: 13px; font-weight: 700; color: {{accent}}">↓ 1.2 kg</span></div>
      </div>
      <svg width="100%" height="110" viewBox="0 0 320 110" preserveAspectRatio="none" role="img" aria-label="Weight falling from 79.6 to 78.4 kilograms">
        <defs><linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{accent}}" stop-opacity=".32"/><stop offset="1" stop-color="{{accent}}" stop-opacity="0"/></linearGradient></defs>
        <g stroke="#1E3253" stroke-width="1"><line x1="0" y1="30" x2="320" y2="30"/><line x1="0" y1="60" x2="320" y2="60"/><line x1="0" y1="90" x2="320" y2="90"/></g>
        <path d="M8 22 L60 28 L112 26 L164 44 L216 52 L268 66 L312 80 L312 110 L8 110Z" fill="url(#pw)"/>
        <polyline points="8,22 60,28 112,26 164,44 216,52 268,66 312,80" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linejoin="round"/>
        <g fill="#081120" stroke="{{accent}}" stroke-width="2.5"><circle cx="8" cy="22" r="4"/><circle cx="60" cy="28" r="4"/><circle cx="112" cy="26" r="4"/><circle cx="164" cy="44" r="4"/><circle cx="216" cy="52" r="4"/><circle cx="268" cy="66" r="4"/><circle cx="312" cy="80" r="5"/></g>
      </svg>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: #93A3BC; text-align: center"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    </div>

    <div style="background: #111F35; border-radius: 20px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">Waist</span>
        <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1">92 cm</span><span style="font-size: 13px; font-weight: 700; color: {{accent}}">↓ 2 cm</span></div>
      </div>
      <svg width="100%" height="64" viewBox="0 0 320 64" preserveAspectRatio="none" role="img" aria-label="Waist falling from 94 to 92 centimetres">
        <path d="M8 16 L112 26 L216 38 L312 50 L312 64 L8 64Z" fill="url(#pw)"/>
        <polyline points="8,16 112,26 216,38 312,50" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linejoin="round"/>
        <g fill="#081120" stroke="{{accent}}" stroke-width="2.5"><circle cx="8" cy="16" r="4"/><circle cx="112" cy="26" r="4"/><circle cx="216" cy="38" r="4"/><circle cx="312" cy="50" r="5"/></g>
      </svg>
    </div>

    <div style="background: #111F35; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 18px">
      <svg width="96" height="96" viewBox="0 0 120 120" role="img" aria-label="Workout completion 85 percent">
        <circle cx="60" cy="60" r="48" fill="none" stroke="#1E3253" stroke-width="13"/>
        <circle cx="60" cy="60" r="48" fill="none" stroke="{{accent}}" stroke-width="13" stroke-linecap="round" stroke-dasharray="256.4 301.6" transform="rotate(-90 60 60)"/>
        <text x="60" y="70" text-anchor="middle" font-family="Barlow Condensed" font-size="32" font-weight="700" fill="#EEF2F8">85%</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">Workout completion</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; color: {{accent}}">6 / 7</span>
        <span style="font-size: 12px; color: #93A3BC">sessions this week</span>
      </div>
    </div>
  </div>

  <nav style="height: 70px; background: #0C182B; border-top: 1px solid #1A2B45; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #93A3BC; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #93A3BC; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Workouts</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #93A3BC; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>Library</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/></svg>Progress</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #93A3BC; font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C14E","options":["#F2C14E","#E0B04A","#D4A537"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'Weekly' }; }
  renderVals() {
    const accent = this.props.accent ?? '#F2C14E';
    const tabs = ['Weekly', 'Monthly', '3 Months'].map(label => ({
      label,
      style: 'height: 40px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; ' +
        (this.state.tab === label ? 'background: ' + accent + '; color: #081120' : 'background: transparent; color: #93A3BC'),
      pick: () => this.setState({ tab: label })
    }));
    return { accent, tabs };
  }
}
</script>
</body>
</html>
