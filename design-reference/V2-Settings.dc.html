<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Ops v2 — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#F2C14E}a:hover{color:#FFD97A}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #081120; color: #EEF2F8; font-family: Inter, sans-serif; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <h1 style="margin: 0; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700">Settings</h1>

  <div style="background: #111F35; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 14px">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: #172A47; border: 3px solid {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: {{accent}}">GC</div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700">Gideon Chuwa</span>
      <span style="font-size: 13px; color: #93A3BC">Goal: military fitness test</span>
    </div>
  </div>

  <div style="background: #111F35; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <a href="#" style="{{r.style}}">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #2B2A1E; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{r.label}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93A3BC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </sc-for>
  </div>

  <button style="margin-top: auto; height: 54px; border-radius: 27px; border: 1.5px solid #8A2E35; background: #2A1218; color: #FF9AA0; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">Delete all my data</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2C14E","options":["#F2C14E","#E0B04A","#D4A537"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['My goals & profile', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'],
      ['Programme & difficulty', 'M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12'],
      ['Reminders', 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4'],
      ['Camera & privacy', 'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z'],
      ['Units & preferences', 'M4 6h16M4 12h10M4 18h6'],
      ['Backup & restore', 'M12 3v12M7 10l5 5 5-5M5 21h14'],
      ['About MILITARY FIT', 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v5M12 8h0'],
      ['Help & support', 'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V14M12 18h0']
    ].map(([label, icon], i, a) => ({
      label, icon,
      style: 'min-height: 56px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #EEF2F8; ' + (i < a.length - 1 ? 'border-bottom: 1px solid #1E3253' : '')
    }));
    return { accent: this.props.accent ?? '#F2C14E', rows };
  }
}
</script>
</body>
</html>
