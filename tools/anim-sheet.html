<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MILITARY FIT — animation contact sheet</title>
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body { max-width: none; width: 1640px; padding: 20px; }
    h1 { margin-bottom: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; margin-top: 14px; }
    .ex { background: var(--card); border-radius: 16px; padding: 12px 14px 10px; margin: 0; }
    .ex h2 { font-size: 22px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .ex h2 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
    .poses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pose { background: var(--bg); border-radius: 12px; overflow: hidden; }
    .pose .stage { height: 178px; position: relative; }
    .pose canvas { width: 100%; height: 100%; display: block; }
    .pose .cap { font-size: 11px; color: var(--muted); padding: 5px 8px 6px; line-height: 1.3; min-height: 34px; }
    .pose .cap b { color: var(--gold); }
  </style>
</head>
<body>
  <h1>MILITARY FIT — animation contact sheet</h1>
  <p class="muted">All 24 exercises, 3 key poses each (start, most different, and a third distinct pose). Time shown under each pose.</p>
  <div class="grid" id="grid"></div>

  <script type="module">
    import { FigurePlayer } from '../js/anim.js';
    import { ANIMATIONS } from '../js/data/animations.js';
    import { EXERCISES } from '../js/data/exercises.js';

    const names = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
    const grid = document.getElementById('grid');
    const pick = (pl, def) => {
      const frames = [];
      for (let t = 0; t <= def.duration; t += 40) {
        const w = pl._eval(t).world;
        frames.push({ t, v: Object.values(w).flat() });
      }
      const dist = (a, b) => Math.sqrt(a.v.reduce((s, x, i) => s + (x - b.v[i]) ** 2, 0));
      const f0 = frames[0];
      const f1 = frames.reduce((b, f) => dist(f, f0) > dist(b, f0) ? f : b, f0);
      const f2 = frames.reduce((b, f) => Math.min(dist(f, f0), dist(f, f1)) > Math.min(dist(b, f0), dist(b, f1)) ? f : b, f0);
      return [f0, f1, f2].map(f => f.t).sort((a, b) => a - b);
    };
    for (const e of EXERCISES) {
      const def = ANIMATIONS[e.anim || e.id];
      const box = document.createElement('section');
      box.className = 'ex';
      box.innerHTML = `<h2>${e.name}<small>${def.view} view · ${(def.duration / 1000).toFixed(1)} s loop</small></h2><div class="poses"></div>`;
      grid.appendChild(box);
      const poses = box.querySelector('.poses');
      // use a throwaway player to pick poses
      const probe = new FigurePlayer(document.createElement('canvas'), def, { reserve: 0, top: 6 });
      const times = pick(probe, def);
      for (const t of times) {
        const cell = document.createElement('div');
        cell.className = 'pose';
        cell.innerHTML = `<div class="stage"><canvas></canvas></div><div class="cap"></div>`;
        poses.appendChild(cell);
        const stage = cell.querySelector('.stage'), canvas = cell.querySelector('canvas');
        const pl = new FigurePlayer(canvas, def, { reserve: 0, top: 6 });
        pl.resize(stage.clientWidth, stage.clientHeight);
        pl.seek(t);
        cell.querySelector('.cap').innerHTML = `<b>${(t / 1000).toFixed(2)} s</b> · ${pl.cue}`;
      }
    }
    window.sheetReady = true;
  </script>
</body>
</html>
